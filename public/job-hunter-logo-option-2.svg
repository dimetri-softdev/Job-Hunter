      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="arrow" x1="25" y1="55" x2="56" y2="23" gradientUnits="userSpaceOnUse">
