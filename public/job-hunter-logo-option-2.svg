  <rect x="4" y="4" width="72" height="72" rx="22" fill="#111827"/>
  <path d="M32 22v25c0 6-3 9-9 9" fill="none" stroke="url(#monogram)" stroke-width="7" stroke-linecap="round"/>
  <path d="M42 55V27c0-3 4-4 6-2l10 11V24" fill="none" stroke="#E2E8F0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
