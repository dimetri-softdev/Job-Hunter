<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-labelledby="title desc">
  <title id="title">JobHunter logo option 1</title>
  <desc id="desc">A compass and rising path mark beside the JobHunter wordmark.</desc>
  <defs>
    <linearGradient id="compass" x1="12" y1="8" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="route" x1="25" y1="54" x2="54" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#DBEAFE"/>
